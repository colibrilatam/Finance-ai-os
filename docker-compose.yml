services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_demo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo_demo_change_me}
    volumes:
      - odoo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-finance_demo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo-init:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo_demo_change_me}
    command: >
      bash -lc "odoo -d ${ODOO_DB:-finance_demo}
      --db_host=db --db_user=${POSTGRES_USER:-odoo} --db_password=${POSTGRES_PASSWORD:-odoo_demo_change_me}
      -i base,account,sale_management,l10n_es --without-demo=all --stop-after-init || true"
    restart: "no"

  odoo:
    image: odoo:19.0
    depends_on:
      odoo-init:
        condition: service_completed_successfully
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo_demo_change_me}
    command: >
      odoo -d ${ODOO_DB:-finance_demo}
      --db_host=db --db_user=${POSTGRES_USER:-odoo} --db_password=${POSTGRES_PASSWORD:-odoo_demo_change_me}
      --database=${ODOO_DB:-finance_demo}
    volumes:
      - odoo-data:/var/lib/odoo

  seed:
    build: ./odoo_seed
    depends_on:
      - odoo
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-finance_demo}
      ODOO_USER: ${ODOO_USER:-admin}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-admin}
    restart: "no"

  finance-core:
    build: ./finance_core
    depends_on:
      - odoo
    ports:
      - "8088:8088"
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-finance_demo}
      ODOO_USER: ${ODOO_USER:-admin}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-admin}
      DEMO_DATA_DIR: /app/demo_data
      CUSTOMER_CODE: ${CUSTOMER_CODE:-CUSTOMER-001}
      CUSTOMER_NAME: ${CUSTOMER_NAME:-Mi Primer Cliente}
      FINANCE_MODE: ${FINANCE_MODE:-SHADOW}
      ERP_PROVIDER: ${ERP_PROVIDER:-odoo}
      READ_ONLY: ${READ_ONLY:-true}
    volumes:
      - ./demo_data:/app/demo_data:ro

  finance-mcp:
    build: ./finance_mcp
    depends_on:
      - finance-core
    ports:
      - "8090:8090"
    environment:
      FINANCE_CORE_URL: http://finance-core:8088
      MCP_PORT: 8090

